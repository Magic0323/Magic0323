name: Update Blog Posts

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python3
        run: |
          import urllib.request, json
          req = urllib.request.Request(
            "https://api.juejin.cn/content_api/v1/article/query_list",
            data=json.dumps({"user_id":"1227480633975166","sort_type":2,"cursor":"0"}).encode(),
            headers={"Content-Type":"application/json"})
          with urllib.request.urlopen(req) as r:
              with open('juejin.json', 'wb') as f:
                  f.write(r.read())
          data = json.load(open('juejin.json'))
          print("Fetched", len(data['data']), "articles")
      - shell: python3
        run: |
          import json, re
          with open('juejin.json') as f:
              arts = json.load(f).get('data', [])
          lines = []
          for a in arts:
              i = a['article_info']
              url = "https://juejin.cn/post/" + i['article_id']
              lines.append("- [" + i['title'] + "](" + url + ")")
          content = '\n'.join(lines) if lines else '*No articles*'
          new_section = '<!-- BLOG-POST-LIST:START -->\n' + content + '\n<!-- BLOG-POST-LIST:END -->'
          with open('README.md') as f:
              readme = f.read()
          new_readme = re.sub(
              r'<!-- BLOG-POST-LIST:START -->.*?<!-- BLOG-POST-LIST:END -->',
              new_section, readme, flags=re.DOTALL)
          with open('README.md', 'w') as f:
              f.write(new_readme)
          print('READ ME updated with', len(arts), 'articles')
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update blog posts"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git push