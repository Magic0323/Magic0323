name: Generate Snake Animation

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk@v3
        with:
          github_user_name: Magic0323
          outputs: |
            dist/github-contribution-grid-snake.gif
            dist/github-contribution-grid-snake-dark.gif?palette=github-dark
      - name: Fix GIF speed
        run: |
          python3 -m pip install pillow -q
          python3 -c "
from PIL import Image
import glob, os
for path in glob.glob('dist/*.gif'):
    img = Image.open(path)
    frames = []
    try:
        while True:
            frames.append(img.copy())
            img.seek(img.tell() + 1)
    except EOFError:
        pass
    if len(frames) > 1:
        frames[0].save(path, save_all=True, append_images=frames[1:], loop=0, duration=300)
        print('OK:', os.path.basename(path), len(frames), 'frames')
    else:
        print('FAIL:', os.path.basename(path), 'only 1 frame')
"
      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: output